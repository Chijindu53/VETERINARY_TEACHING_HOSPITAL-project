<section class="pet-reg">

  <div class="container mt-2 text-light fw-bold pet">

    <div class="col-md-10 mx-auto">

      <h3 class="text-center">Register With Us</h3>
      <h5 class="text-center mb-4">(Pet Information)</h5>

      <form>

        <div class="row">

         
          <div class="col-6 mb-4">
            <label for="petName" class="form-label">Pet Name:</label>
            <input type="text" class="form-control control-2" id="petName"
                   placeholder="Enter your pet's name" required>
          </div>

         
          <div class="col-6 mb-4">
            <label for="sex" class="form-label">Sex:</label>
            <select class="form-select control-2" id="sex" required>
              <option selected disabled>Select sex</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

         
          <div class="col-6 mb-4">
            <label for="petAge" class="form-label">Pet's Age:</label>
            <input type="number" class="form-control control-2" id="petAge"
                   placeholder="Enter your pet's age" required>
          </div>

         
          <div class="col-6 mb-4">
            <label for="species" class="form-label">Species:</label>
            <select class="form-select control-2" id="species" required>
              <option selected disabled>Select species</option>
              <option value="dog">Dog</option>
              <option value="cat">Cat</option>
              <option value="rabbit">Rabbit</option>
              <option value="bird">Bird</option>
              <option value="other">Others</option>
            </select>
          </div>

         <div class="row justify-content-center">
          <div class="col-6 mb-4  ">
            <label for="breed" class="form-label">Breed:</label>
            <select class="form-select control-2" id="breed" required>
              <option selected disabled>Select breed</option>
              <option value="german-shepherd">German Shepherd</option>
              <option value="labrador">Labrador Retriever</option>
              <option value="rottweiler">Rottweiler</option>
              <option value="bulldog">Bulldog</option>
              <option value="other">Others</option>
            </select>
          </div>
           </div>
        </div>

       
        <div class="text-center d-flex justify-content-around">

          <a href="register-client.html"
             class="btn btn-light mb-3 px-4 back-btn register-btn">
            PREV
          </a>

          <a href="login.html"
             class="btn btn-success mb-3 px-4 next-btn register-btn">
            SUBMIT
          </a>

        </div>

      </form>

    </div>
  </div>

</section>
