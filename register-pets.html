<section class="pet-reg">
  <div class="container mt-4">
    <div class="col-md-6 mx-auto">

      <h3 class="text-center mb-3">Register With Us</h3>
      <h5 class="text-center">(Pet Information)</h5>
    </div>

      <form>

        <div class="mb-4">
          <label for="name" class="form-label">Pet Name:</label>
          <input type="text" class="form-control" id="name"
          placeholder="Enter your name" required>
        </div>
         
         <div class="mb-4">
          <label for="genderr" class="form-label">Sex</label>
          <select class="form-select" id="sex" required>
            <option selected>Select sex</option>
            <option value="1">Male</option>
            <option value="1">Female</option>
            </select>
            </div>

         <div class="mb-4">
          <label for="petAge" class="form-label">Pet's Age:</label>
          <input type="number" class="form-control" id="petAge"
                 placeholder="Enter your pet's age">
        </div>

      
        <div class="mb-4">
          <label for="petType" class="form-label">Species</label>
          <select class="form-select" id="species" required>
            <option selected>Select specie</option>
            <option value="1">Dog</option>
            <option value="2">Cat</option>
            <option value="3">Rabbit</option>
            <option value="4">Bird</option>
            <option value="5">Others</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="petType" class="form-label">Breed</label>
          <select class="form-select" id="species" required>
            <option selected disabled>Select breed</option>
            <option value="1">German Shepherd</option>
            <option value="2">Labrador Retriever</option>
            <option value="3">Rottweiler</option>
            <option value="4">Bulldog</option>
            <option value="5">Others</option>
          </select>
        </div>


        <div class="text-center d-flex justify-content-around"> 
        <a href="register-client.html" class="btn btn-success mb-3 px-4">PREV</a> 
        <a href="login.html" class="btn btn-dark mb-3 px-4">Submit</a> 
         
              
       </div> 

      </form>

    </div>
  </div>
