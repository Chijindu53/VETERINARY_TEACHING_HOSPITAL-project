<section class="client-reg">

  <div class="container  text-light fw-bold client">

    <div class="reg-form col-md-10 mx-auto">

      <h3 class="text-center">Register With Us</h3>
      <h5 class="text-center mb-4">(Client Information)</h5>

      <form>

        <div class="row">

          
          <div class="col-6 mb-4">
            <label for="firstName" class="form-label">First Name:</label>
            <input type="text" class="form-control control-2" id="firstName"
                   placeholder="Enter your first name" required>
          </div>

          
          <div class="col-6 mb-4">
            <label for="lastName" class="form-label">Last Name:</label>
            <input type="text" class="form-control control-2" id="lastName"
                   placeholder="Enter your last name" required>
          </div>

         
          <div class="col-6 mb-4">
            <label for="gender" class="form-label">Gender:</label>
            <select class="form-select control-2" id="gender" required>
              <option selected disabled>Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          
          <div class="col-6 mb-4">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control control-2" id="email"
                   placeholder="Enter your email" required>
          </div>

          
          <div class="col-6 mb-4">
            <label for="phone" class="form-label">Phone Number:</label>
            <input type="tel" class="form-control control-2" id="phone"
                   placeholder="Enter your phone number" required>
          </div>

          
          <div class="col-6 mb-4">
            <label for="address" class="form-label">Address:</label>
            <input type="text" class="form-control control-2" id="address"
                   placeholder="Enter your address" required>
          </div>

          
          <div class="col-md-6 mb-4">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control control-2" id="password"
                   placeholder="Enter your password" required>
          </div>

         
          <div class="col-md-6 mb-4">
            <label for="confirmPassword" class="form-label">
              Confirm Password:
            </label>
            <input type="password" class="form-control control-2"
                   id="confirmPassword"
                   placeholder="Confirm your password" required>
          </div>

        </div>

       
        <div class="text-center d-flex justify-content-around">

          <a href="index.html"
             class="btn btn-light mb-3 px-4 back-btn">
            PREV
          </a>

          <a href="register-pets.html"
             class="btn btn-success mb-3 px-4 next-btn">
            NEXT
          </a>

        </div>

      </form>

    </div>
